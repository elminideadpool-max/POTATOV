<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astraeus Security | FiveM Audit Tool</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');

        :root {
            --primary: #7d5bbe;
            --dark: #0a0a0c;
            --card: #141418;
            --text: #ffffff;
            --accent: #a885f0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--dark);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
        }

        .container {
            text-align: center;
            background: var(--card);
            padding: 50px 80px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(125, 91, 190, 0.2);
            backdrop-filter: blur(10px);
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: -2px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 40px;
            font-weight: 300;
        }

        .download-btn {
            display: inline-block;
            padding: 20px 50px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            border-radius: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(125, 91, 190, 0.4);
            cursor: pointer;
            border: none;
        }

        .download-btn:hover {
            background: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(125, 91, 190, 0.6);
        }

        .features {
            margin-top: 50px;
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .feature-item {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.4);
        }

        .feature-item strong {
            color: var(--primary);
            display: block;
        }

        .logo {
            font-size: 5rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🛡️</div>
        <h1>ASTRAEUS SECURITY</h1>
        <p>Advanced FiveM Forensic Audit System</p>
        
        <!-- ENLACE DE DESCARGA: Aquí el usuario pondría su link real -->
        <a href="https://mega.nz/file/Lm5kja7D#m75j_ZGWt0eYndjhW1IaBp11BrNh96i1ROKC-DHF35s" class="download-btn">INSTALAR SCANNER</a>

        <div class="features">
            <div class="feature-item">
                <strong>GENETIC SCAN</strong>
                Deep DNA Analysis
            </div>
            <div class="feature-item">
                <strong>FAST SYNC</strong>
                Real-time Reporting
            </div>
            <div class="feature-item">
                <strong>SECURE</strong>
                Port Encrypted
            </div>
        </div>
    </div>

</body>
</html>
